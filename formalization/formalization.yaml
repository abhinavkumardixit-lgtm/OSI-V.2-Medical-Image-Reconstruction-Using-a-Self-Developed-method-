  description: >
    Lean 4 formalization of the cumulative coordinate displacement bound in multi-layer
    norm-clamped geometric neural networks, proving ||x^(L) - x^(0)|| <= L * c for any
    L-layer network equipped with a 1-Lipschitz norm-clamping operator of radius c.
