version: "v0.4"

project:
  name: "osi-tme-fuse-theorem-7"
  title: "Formal Proof of Theorem 7: Cumulative Displacement Bound under Norm-Clamping"
  description: >-
    Lean 4 formalization of the cumulative coordinate displacement bound in multi-layer
    norm-clamped geometric neural networks, proving ||x^(L) - x^(0)|| <= L * c for any
    L-layer network equipped with a 1-Lipschitz norm-clamping operator of radius c.
  license: "Apache-2.0"
  authors:
    - name: "Abhinav Kumar Dixit"
      email: "abhinavkumardixit@gmail.com"
  responsible_maintainers:
    - name: "Abhinav Kumar Dixit"
      email: "abhinavkumardixit@gmail.com"

classification:
  msc2020:
    - "68T07"
    - "51M04"
    - "03B35"
  arxiv:
    - "cs.LG"
    - "math.MG"

sources:
