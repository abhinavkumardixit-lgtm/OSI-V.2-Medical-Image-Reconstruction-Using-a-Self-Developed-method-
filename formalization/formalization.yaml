version: "v0.4"

project:
  name: "osi-tme-fuse-theorem-7"
  title: "Formal Proof of Theorem 7: Cumulative Coordinate Trajectory Bound under Norm-Clamping"
  description: >-
    Formalization in Lean 4 of the geometric coordinate trajectory bound established in Theorem 7 of Dixit (2026).
    The formalization explicitly defines the norm-clamping operator predicate IsNormClamp(Pi, c) bounding
    step displacements by c in an arbitrary real normed additive group, and constructs the recursive coordinate
    trajectory x^(l+1) = x^(l) + Pi(v^(l)) driven by an arbitrary sequence of unconstrained directional proposals v^(l).
    It proves that the cumulative spatial displacement from the origin x^(0) after L recursive layers is strictly bounded
    by L * c. This result establishes the foundational mathematical stability contract that prevents coordinate explosion
    and boundary artifacts in geometric deep learning, without formalizing the decoupled discrete graph feature message-passing layers.
